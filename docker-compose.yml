services:
  # ─────────────────────────────────────────────
  # QuantClaw Agent (one-shot query)
  #   docker compose run --rm quantclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  quantclaw-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantclaw-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./config/config.json:/home/quantclaw/.quantclaw/config.json:ro
      - quantclaw-workspace:/home/quantclaw/.quantclaw/workspace
    entrypoint: ["quantclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # QuantClaw Gateway (Long-running Bot)
  #   docker compose up quantclaw-gateway
  # ─────────────────────────────────────────────
  quantclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantclaw-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      # Configuration file
      - ./config/config.json:/home/quantclaw/.quantclaw/config.json:ro
      # Persistent workspace (sessions, memory, logs)
      - quantclaw-workspace:/home/quantclaw/.quantclaw/workspace
    command: ["gateway"]

volumes:
  quantclaw-workspace:
